name: Build & Deploy App

on:
#   push:
#     branches: [main]
#     paths-ignore:
#       - "infra/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: Ai-Observability
  ACR_NAME: aiobservabilityneu
  CONTAINER_APP_NAME: ai-obs-poc-app
  IMAGE_NAME: ai-observability-poc

jobs:
  # ---------------------------------------------------------------
  # 1. Lint & Test
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app/ tests/

      - name: Run tests
        run: pytest --tb=short -q

  # ---------------------------------------------------------------
  # 2. Build & Push container image to ACR
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push image
        id: meta
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          IMAGE_TAG="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # 3. Deploy to Container App
  # ---------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    outputs:
      app-url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new revision
        id: deploy
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image-tag }}"

          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "app-url=https://${FQDN}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  # 4. Smoke test
  # ---------------------------------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check
        run: |
          APP_URL="${{ needs.deploy.outputs.app-url }}"
          echo "Testing $APP_URL/health ..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 10 attempts"
          exit 1

[project]
name = "ai-observability-poc"
version = "0.1.0"
description = "AI-driven observability platform — alert to root-cause to GitHub issue"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "langgraph>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "azure-monitor-query>=1.4,<2",
    "azure-identity>=1.19,<2",
    "openai>=1.60,<2",
    "PyGithub>=2.5,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
